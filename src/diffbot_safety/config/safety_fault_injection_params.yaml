safety_supervisor:
  ros__parameters:
    control_frequency_hz: 50.0
    status_frequency_hz: 10.0

    input_command_topic: /cmd_vel_collision_checked
    scan_topic: /safety_benchmark/scan
    odom_topic: /safety_benchmark/odometry
    output_command_topic: /cmd_vel_safe
    status_topic: /safety/status
    diagnostics_topic: /diagnostics
    estop_topic: /safety/estop
    reset_service: /safety/reset

    localization_manager_service: /safety_benchmark/localization/is_active
    navigation_manager_service: /safety_benchmark/navigation/is_active

    command_timeout_sec: 0.30
    scan_timeout_sec: 0.50
    odom_timeout_sec: 0.50
    mcu_heartbeat_timeout_sec: 0.20
    nav2_poll_period_sec: 0.25
    nav2_health_timeout_sec: 1.00
    reset_health_hold_sec: 0.50

    max_forward_velocity: 0.25
    max_reverse_velocity: 0.10
    max_angular_velocity: 1.00
    zero_velocity_epsilon: 0.0001

    require_scan: true
    require_odom: true
    require_nav2_active: true
    require_mcu_heartbeat: false
